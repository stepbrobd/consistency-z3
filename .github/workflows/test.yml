name: Test

on:
  pull_request:
  push:

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nix
        uses: cachix/install-nix-action@v31
      - name: Setup
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv sync
          nix shell nixpkgs#cvc5
      - name: Test
        run: |
          uv run pytest --cov=consistency tests -sm 'not slow'
